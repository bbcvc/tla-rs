[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/bbcvc/tla-rs"
homepage = "https://github.com/bbcvc/tla-rs"
keywords = ["tla", "tlaplus", "model-checker", "tlc", "formal-methods"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tla-tools-intern = { version = "0.2.0", path = "crates/tla-tools-intern" }
tla-tools-ast = { version = "0.2.0", path = "crates/tla-tools-ast" }
tla-tools-parser = { version = "0.2.0", path = "crates/tla-tools-parser" }
tla-tools-resolve = { version = "0.2.0", path = "crates/tla-tools-resolve" }
tla-tools-value = { version = "0.2.0", path = "crates/tla-tools-value" }
tla-tools-eval = { version = "0.2.0", path = "crates/tla-tools-eval" }
tla-tools-checker = { version = "0.2.0", path = "crates/tla-tools-checker" }

chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
lasso = { version = "0.7", features = ["multi-threaded"] }
serde_json = "1"
stacker = "0.1.25"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-tlaplus = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
