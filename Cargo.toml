[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tla-intern = { path = "crates/tla-intern" }
tla-ast = { path = "crates/tla-ast" }
tla-parser = { path = "crates/tla-parser" }
tla-resolve = { path = "crates/tla-resolve" }
tla-value = { path = "crates/tla-value" }
tla-eval = { path = "crates/tla-eval" }
tla-checker = { path = "crates/tla-checker" }

foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
lasso = { version = "0.7", features = ["multi-threaded"] }
serde_json = "1"
stacker = "0.1.25"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-tlaplus = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
