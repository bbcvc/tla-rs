# Publishes a release when a tag vX.Y.Z is pushed, X.Y.Z being the version in Cargo.toml:
# prebuilt binaries to the GitHub release and to npm (tla-rs and tla-rs-<os>-<arch>),
# and every crate to crates.io.
#
# npm packages are published with trusted publishing (OIDC): each of tla-rs and tla-rs-* must
# trust this workflow (npm trust github <package> --repo bbcvc/tla-rs --file release.yml
# --allow-publish). A new platform package must first be published by hand, since npm trusts
# only packages that exist. crates.io needs the repository secret CARGO_REGISTRY_TOKEN, a token
# with publish-new and publish-update scopes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack everything, but publish nothing
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tla-tools") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, npm: darwin-arm64, os: macos-latest }
          - { target: x86_64-apple-darwin, npm: darwin-x64, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, npm: linux-x64, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, npm: linux-arm64, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, npm: win32-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ contains(matrix.target, 'windows') && 'tla-rs.exe' || 'tla-rs' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p tla-tools --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        working-directory: crates/tla-tools/tests/golden
        run: |
          set +e
          "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/$EXE" Deadlock.tla
          test $? -eq 11
      - name: Archive
        shell: bash
        run: |
          name=tla-rs-v${{ needs.version.outputs.version }}-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/$EXE README.md LICENSE dist/$name/
          cd dist
          if [[ "$EXE" == *.exe ]]; then 7z a -bd $name.zip $name >/dev/null; else tar czf $name.tar.gz $name; fi
          rm -r $name
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/${{ env.EXE }}

  github-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - run: (cd dist && sha256sum * > SHA256SUMS) && ls -l dist
      - if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v${{ needs.version.outputs.version }}
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" dist/* -R "$GITHUB_REPOSITORY" --clobber

  npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing; npm also attaches provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5.1 or newer is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: bin
      - name: Pack
        run: |
          for dir in bin/npm-*; do
            platform=${dir#bin/npm-}
            node npm/scripts/package.mjs platform "$platform" "$(ls "$dir"/tla-rs*)" "pkg/tla-rs-$platform"
          done
          node npm/scripts/package.mjs main pkg/tla-rs
          for dir in pkg/*; do (cd "$dir" && npm pack --dry-run); done
      # The platform packages go first, so that tla-rs never depends on a version that is missing.
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for dir in pkg/tla-rs-* pkg/tla-rs; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done

  crates:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: env.DRY_RUN == 'true'
        run: cargo publish --workspace --locked --dry-run
      # In dependency order, skipping crates already published, so a rerun after a partial failure
      # publishes only the rest.
      - if: env.DRY_RUN != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for crate in tla-tools-intern tla-tools-ast tla-tools-value tla-tools-parser \
                       tla-tools-resolve tla-tools-eval tla-tools-checker tla-tools; do
            if curl -sf -A "tla-rs release (github.com/bbcvc/tla-rs)" \
                 "https://crates.io/api/v1/crates/$crate/$VERSION" >/dev/null; then
              echo "$crate $VERSION is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done
